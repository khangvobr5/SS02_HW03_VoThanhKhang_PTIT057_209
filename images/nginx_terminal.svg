<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <rect width="920" height="540" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="920" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="310" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Terminal: devops@ubuntu-devops-server — Nginx Setup</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Prompt 1 -->
    <text x="24" y="68" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="68" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="68" fill="rgb(56, 189, 248)">sudo ln -s /etc/nginx/sites-available/ptit-web.conf /etc/nginx/sites-enabled/</text>

    <!-- Prompt 2 -->
    <text x="24" y="105" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="105" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="105" fill="rgb(56, 189, 248)">sudo rm -f /etc/nginx/sites-enabled/default</text>

    <!-- Prompt 3: Check Syntax -->
    <text x="24" y="142" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="142" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="142" fill="rgb(56, 189, 248)">sudo nginx -t</text>

    <text x="24" y="172" fill="rgb(203, 213, 225)">nginx: the configuration file /etc/nginx/nginx.conf syntax is ok</text>
    <text x="24" y="194" fill="rgb(34, 197, 94)" font-weight="bold">nginx: configuration file /etc/nginx/nginx.conf test is successful</text>

    <!-- Prompt 4: Reload Nginx -->
    <text x="24" y="235" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="235" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="235" fill="rgb(56, 189, 248)">sudo systemctl reload nginx</text>

    <!-- Prompt 5: Check Status -->
    <text x="24" y="272" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="272" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="272" fill="rgb(56, 189, 248)">sudo systemctl status nginx --no-pager</text>

    <text x="24" y="302" fill="rgb(203, 213, 225)">● nginx.service - A high performance web server and a reverse proxy server</text>
    <text x="24" y="324" fill="rgb(203, 213, 225)">     Loaded: loaded (/lib/systemd/system/nginx.service; enabled; vendor preset: enabled)</text>
    <text x="24" y="346" fill="rgb(34, 197, 94)">     Active: active (running) </text>
    <text x="215" y="346" fill="rgb(148, 163, 184)">since Sat 2026-10-03 07:12:44 UTC; 45s ago</text>

    <!-- Prompt 6: Test HTTP with curl -->
    <text x="24" y="388" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="388" fill="rgb(248, 250, 252)">:~$ </text>
    <text x="275" y="388" fill="rgb(56, 189, 248)">curl -I http://localhost</text>

    <text x="24" y="418" fill="rgb(34, 197, 94)" font-weight="bold">HTTP/1.1 200 OK</text>
    <text x="24" y="438" fill="rgb(203, 213, 225)">Server: nginx/1.18.0 (Ubuntu)</text>
    <text x="24" y="458" fill="rgb(203, 213, 225)">Content-Type: text/html</text>
    <text x="24" y="478" fill="rgb(203, 213, 225)">Content-Length: 4628</text>
    <text x="24" y="498" fill="rgb(203, 213, 225)">Connection: keep-alive</text>

    <text x="24" y="526" fill="rgb(34, 197, 94)">devops@ubuntu-devops-server</text>
    <text x="240" y="526" fill="rgb(248, 250, 252)">:~$ </text>
  </g>
</svg>
